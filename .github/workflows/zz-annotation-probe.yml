name: Annotation probe (temporary)
on:
  push:
    branches: [feature/wizard-console]
permissions:
  contents: read
  checks: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Write a result check run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
          const text = ("row " + "y".repeat(90) + "\n").repeat(600).slice(0, 60000);
          require("fs").writeFileSync("body.json", JSON.stringify({ name: "Wizard result probe-1", head_sha: process.env.GITHUB_SHA, status: "completed", conclusion: "success",
            output: { title: "probe ok", summary: "Rows: 600", text } }));'
          gh api repos/${{ github.repository }}/check-runs --input body.json --jq '"created " + (.id|tostring)'
